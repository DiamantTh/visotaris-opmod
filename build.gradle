import com.github.gradle.node.npm.task.NpmTask

plugins {
    // Gradle Node Plugin: lädt Node.js + npm automatisch herunter,
    // kein lokales npm/node auf dem Build-System erforderlich.
    id 'com.github.node-gradle.node'
}

node {
    download         = true                          // Node.js + npm automatisch herunterladen
    version          = property('node_version')      // Version aus gradle.properties
    nodeProjectDir   = rootProject.file('webui')     // webui/ ist das npm-Projekt
}

// Root build.gradle – gemeinsame Konfiguration für alle Subprojekte.
// Der eigentliche Gradle-Build läuft in den versionsspezifischen Subprojekten.

// ── Bequeme Build-Tasks vom Root aus ─────────────────────────────────────────
//
//   ./gradlew buildAll            → 1.21.11 und 26.1.2 bauen + JARs nach ./out/ kopieren
//   ./gradlew build-1.21.11       → 1.21.11 bauen + JAR nach ./out/ kopieren
//   ./gradlew build-26.1.2        → 26.1.2 bauen + JAR nach ./out/ kopieren
//   ./gradlew runClient           → bevorzugten Dev-Client starten (aktuell 1.21.11)
//   ./gradlew runClient-1.21.11   → Dev-Client für 1.21.11 starten
//   ./gradlew runClient-26.1.2    → Dev-Client für 26.1.2 starten
//
// Hinweis: Doppelpunkte im Tasknamen (`runClient:1.21.11`) erlaubt Gradle nicht.
// Der Gradle-native Doppelpunktweg ist stattdessen: `./gradlew :1.21.11:runClient`
//
// Die finalen Mod-JARs landen immer unter:
//   out/visotaris_opmod-<mod_version>+mc1.21.11.jar
//   out/visotaris_opmod-<mod_version>+mc26.1.2.jar
// ─────────────────────────────────────────────────────────────────────────────

def outDir = rootProject.file('out')

def build12111Task = tasks.register('build-1.21.11') {
    group       = 'visotaris'
    description = 'Baut nur MC 1.21.11 und kopiert den JAR nach ./out/'
    dependsOn   ':1.21.11:remapJar'
    doLast {
        outDir.mkdirs()
        def jar = project('1.21.11').tasks.getByName('remapJar').archiveFile.get().asFile
        copy { from jar; into outDir }
        logger.lifecycle("  → out/${jar.name}")
    }
}

def build2612Task = tasks.register('build-26.1.2') {
    group       = 'visotaris'
    description = 'Baut nur MC 26.1.2 und kopiert den JAR nach ./out/'
    dependsOn   ':26:shadowJar'
    doLast {
        outDir.mkdirs()
        def jar = project('26').tasks.getByName('shadowJar').archiveFile.get().asFile
        copy { from jar; into outDir }
        logger.lifecycle("  → out/${jar.name}")
    }
}

tasks.register('buildAll') {
    group       = 'visotaris'
    description = 'Baut MC 1.21.11 und 26.1.2 und kopiert die JARs nach ./out/'
    dependsOn   build12111Task, build2612Task
}

def runClient12111Task = tasks.register('runClient-1.21.11') {
    group       = 'visotaris'
    description = 'Startet den Dev-Client für MC 1.21.11 (inkl. Mod Menu).'
    dependsOn   ':1.21.11:runClient'
}

def runClient2612Task = tasks.register('runClient-26.1.2') {
    group       = 'visotaris'
    description = 'Startet den Dev-Client für MC 26.1.2 (inkl. Mod Menu).'
    dependsOn   ':26:runClient'
}

tasks.register('runClient') {
    group       = 'visotaris'
    description = 'Startet den bevorzugten Dev-Client (aktuell MC 1.21.11, inkl. Mod Menu).'
    dependsOn   runClient12111Task
}

// ── Svelte Web-UI Build ───────────────────────────────────────────────────────
// Kompiliert das webui/-Svelte-Projekt und schreibt das Ergebnis nach
// src/main/resources/assets/webui/ (wird von allen Subprojekten als Ressource eingebunden).
tasks.register('npmBuildWebui', NpmTask) {
    group       = 'visotaris'
    description = 'Baut das Svelte Web-UI (webui/ → src/main/resources/assets/webui/)'
    // args = npm-Argumente; workingDir kommt aus node.nodeProjectDir (webui/)
    args        = ['run', 'build']
    dependsOn   tasks.named('npmInstall')  // stellt sicher dass node_modules aktuell sind

    // Inkrementell: nur neu bauen wenn Quelldateien sich geändert haben
    inputs.dir  rootProject.file('webui/src')
    inputs.files rootProject.file('webui/vite.config.js'),
                 rootProject.file('webui/svelte.config.js'),
                 rootProject.file('webui/package.json')
    outputs.dir rootProject.file('src/main/resources/assets/webui/static/app')
}

// Stille Kompatibilitätsaliases für alte Namen
tasks.register('build12111')    { group = null; dependsOn build12111Task }
tasks.register('build2612')     { group = null; dependsOn build2612Task }
tasks.register('runClient12111'){ group = null; dependsOn runClient12111Task }
tasks.register('runClient2612') { group = null; dependsOn runClient2612Task }

// Jedes Subprojekt hängt seinen remapJar-Output automatisch nach ./out/
subprojects {
    // group/version/repos brauchen keine Plugins – direkt setzbar.
    // version nutzt ext.mcVersion aus dem jeweiligen build.gradle (z.B. '1.21.11' oder '26.1.2'),
    // damit der JAR-Name die exakte MC-Version trägt, unabhängig vom Verzeichnisnamen.
    group   = property('mod_group')

    repositories {
        maven {
            name = 'Fabric'
            url  = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'TerraformersMC'
            url  = 'https://maven.terraformersmc.com/releases'
        }
        mavenCentral()
    }

    // Alles was Loom/Java-Plugin voraussetzt muss in afterEvaluate,
    // weil subprojects{} vor dem eigenen build.gradle des Subprojekts läuft.
    afterEvaluate {
        version = "${property('mod_version')}+mc${project.ext.properties.getOrDefault('mcVersion', project.name)}"

        // Java-Compiler-Optionen
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release  = (project.ext.properties.getOrDefault('javaVersion', 21) as int)
        }

        // Gemeinsamer Quellcode (root src/) in das Subprojekt einhängen
        sourceSets {
            main {
                java   { srcDir rootProject.file('src/main/java') }
                kotlin { srcDir rootProject.file('src/main/kotlin') }
                resources { srcDir rootProject.file('src/main/resources') }
            }
        }

        // Web-UI muss vor den Ressourcen gebaut sein
        tasks.named('processResources') { dependsOn(':npmBuildWebui') }

        // ${version} in fabric.mod.json ersetzen
        processResources {
            inputs.property 'version', project.version
            inputs.property 'discordApplicationId', rootProject.findProperty('discord_application_id') ?: ''
            filteringCharset 'UTF-8'
            filesMatching('fabric.mod.json') {
                expand version: project.version
            }
            filesMatching('visotaris_opmod.properties') {
                expand discordApplicationId: rootProject.findProperty('discord_application_id') ?: ''
            }
        }
    }
}
