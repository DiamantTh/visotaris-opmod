import com.github.gradle.node.npm.task.NpmTask

plugins {
    // Gradle Node Plugin: lädt Node.js + npm automatisch herunter,
    // kein lokales npm/node auf dem Build-System erforderlich.
    id 'com.github.node-gradle.node'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
}

node {
    download         = true                          // Node.js + npm automatisch herunterladen
    version          = property('node_version')      // Version aus gradle.properties
    nodeProjectDir   = rootProject.file('webui')     // webui/ ist das npm-Projekt
}

// Root build.gradle – gemeinsame Konfiguration für alle Subprojekte.
// Der eigentliche Gradle-Build läuft in den versionsspezifischen Subprojekten.

// Visotaris 1.2.x targets Minecraft 26.x only.
// ./gradlew buildAll / build-26.x → final JAR in out/
// ./gradlew runClient / runClient-26.x → Minecraft 26.x development client

def outDir = rootProject.file('out')

def build26xTask = tasks.register('build-26.x') {
    group       = 'visotaris'
    description = 'Baut nur die aktuelle MC-26.x-Zielversion und kopiert den JAR nach ./out/'
    dependsOn   ':26.x:shadowJar'
}

gradle.projectsEvaluated {
    def shadowJarArchive = project(':26.x').tasks.named('shadowJar').map { it.archiveFile.get().asFile }
    build26xTask.configure {
        doLast {
            outDir.mkdirs()
            def jarFile = shadowJarArchive.get()
            copy { from jarFile; into outDir }
            logger.lifecycle("  → out/${jarFile.name}")
        }
    }
}

tasks.register('buildAll') {
    group       = 'visotaris'
    description = 'Baut Minecraft 26.x und kopiert den JAR nach ./out/'
    dependsOn   build26xTask
}

def runClient26xTask = tasks.register('runClient-26.x') {
    group       = 'visotaris'
    description = 'Startet den Dev-Client für die aktuelle MC-26.x-Zielversion (inkl. Mod Menu).'
    dependsOn   ':26.x:runClient'
}

tasks.register('runClient') {
    group       = 'visotaris'
    description = 'Startet den Minecraft-26.x-Dev-Client (inkl. Mod Menu).'
    dependsOn   runClient26xTask
}

// ── Svelte Web-UI Build ───────────────────────────────────────────────────────
// Kompiliert das webui/-Svelte-Projekt und schreibt das Ergebnis nach
// src/main/resources/assets/webui/ (wird von allen Subprojekten als Ressource eingebunden).
tasks.register('npmBuildWebui', NpmTask) {
    group       = 'visotaris'
    description = 'Baut das Svelte Web-UI (webui/ → src/main/resources/assets/webui/)'
    // args = npm-Argumente; workingDir kommt aus node.nodeProjectDir (webui/)
    args        = ['run', 'build']
    dependsOn   tasks.named('npmInstall')  // stellt sicher dass node_modules aktuell sind

    // Inkrementell: nur neu bauen wenn Quelldateien sich geändert haben
    inputs.dir  rootProject.file('webui/src')
    inputs.files rootProject.file('webui/vite.config.js'),
                 rootProject.file('webui/svelte.config.js'),
                 rootProject.file('webui/package.json')
    outputs.dir rootProject.file('src/main/resources/assets/webui/static/app')
}

// Stille Kompatibilitätsaliases für alte Namen
tasks.register('build2612')     { group = null; dependsOn build26xTask }
tasks.register('runClient2612') { group = null; dependsOn runClient26xTask }

// Gemeinsame Konfiguration für die aktive Minecraft-26.x-Plattform.
subprojects {
    apply plugin: 'maven-publish'

    // group/version/repos brauchen keine Plugins – direkt setzbar.
    // version nutzt ext.mcVersion aus dem jeweiligen build.gradle (aktuell '26.2'),
    // damit der JAR-Name die exakte MC-Version trägt, unabhängig vom Verzeichnisnamen.
    group   = property('mod_group')

    repositories {
        maven {
            name = 'Fabric'
            url  = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'TerraformersMC'
            url  = 'https://maven.terraformersmc.com/releases'
        }
        maven {
            name = 'Modrinth'
            url  = 'https://api.modrinth.com/maven'
        }
        maven {
            name = 'FallenBreath'
            url  = 'https://maven.fallenbreath.me/releases'
        }
        mavenCentral()
    }

    // Alles was Loom/Java-Plugin voraussetzt muss in afterEvaluate,
    // weil subprojects{} vor dem eigenen build.gradle des Subprojekts läuft.
    afterEvaluate {
        version = "${property('mod_version')}+mc${project.ext.properties.getOrDefault('mcVersion', project.name)}"

        // Java-Compiler-Optionen
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release  = (project.ext.properties.getOrDefault('javaVersion', 25) as int)
        }

        // Gemeinsamer Quellcode (root src/) in das Subprojekt einhängen
        sourceSets {
            main {
                java   { srcDir rootProject.file('src/main/java') }
                kotlin { srcDir rootProject.file('src/main/kotlin') }
                resources { srcDir rootProject.file('src/main/resources') }
            }
            test {
                java { srcDir rootProject.file('src/test/java') }
                resources { srcDir rootProject.file('src/test/resources') }
            }
        }

        // Web-UI muss vor den Ressourcen gebaut sein
        tasks.named('processResources') { dependsOn(':npmBuildWebui') }

        // Resource-Expansion während der Konfiguration auflösen. In Task-Aktionen
        // darf Gradle 10 nicht mehr über Task.project erreicht werden.
        def resourceVersion = project.version
        def resourceDiscordApplicationId = rootProject.findProperty('discord_application_id') ?: ''

        // ${version} in fabric.mod.json ersetzen
        processResources {
            inputs.property 'version', resourceVersion
            inputs.property 'discordApplicationId', resourceDiscordApplicationId
            filteringCharset = 'UTF-8'
            filesMatching('fabric.mod.json') {
                expand version: resourceVersion
            }
            filesMatching('visotaris_opmod.properties') {
                expand discordApplicationId: resourceDiscordApplicationId
            }
        }

        // ── Maven-Publish (Forgejo-Package-Registry, Gruppe "Minecraft") ─────────
        // URL + Token kommen NICHT aus diesem Repo, sondern aus der globalen
        // ~/.gradle/gradle.properties (Profil-Schema "forgejo.<Profil>.url/.token").
        // publishTaskName wird pro Subprojekt gesetzt (shadowJar für 26.x),
        // weil das der jeweils finale, ausgelieferte Mod-JAR ist.
        //
        // Eine artifactId fuer alle MC-Versionen ("visotaris_opmod"): project.version
        // enthaelt bereits das +mcX-Suffix (z.B. "1.1.5-2+mc26.2"), das reicht als
        // Unterscheidung - Maven-Versionen sind unsortierte Strings, es muss ohnehin
        // immer die exakte Version angefragt werden. Getrennte artifactIds pro
        // MC-Version brachten nur Registry-Unordnung ohne echten Nutzen.
        def publishTaskName = project.ext.properties.getOrDefault('publishTaskName', 'jar')
        publishing {
            publications {
                maven(MavenPublication) {
                    artifactId = property('mod_id')
                    artifact(tasks.named(publishTaskName)) {
                        builtBy tasks.named(publishTaskName)
                    }
                }
            }
            repositories {
                maven {
                    name = 'forgejo'
                    url  = rootProject.findProperty('forgejo.Minecraft_s_git.url') ?: ''
                    credentials(HttpHeaderCredentials) {
                        name  = 'Authorization'
                        value = "token ${rootProject.findProperty('forgejo.Minecraft_s_git.token') ?: ''}"
                    }
                    authentication {
                        header(HttpHeaderAuthentication)
                    }
                }
            }
        }
    }
}
