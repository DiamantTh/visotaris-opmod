# Gradle-Tuning
# Konservativere RAM-Grenzen, damit nicht mehrere große Java-/Gradle-Prozesse parallel zu viel Speicher ziehen.
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# ── Mod-Metadaten ────────────────────────────────────────────────────────────
mod_id=visotaris_opmod
mod_name=Visotaris OPMod
mod_version=1.2.0-pre.5
mod_group=systems.diath

# Discord Rich Presence
# Public Discord Developer Portal Application ID. Empty = must be provided via config.
discord_application_id=

# ── Tool-Versionen ────────────────────────────────────────────────────────────

# Gradle Node Plugin + Node.js (Web-UI Build; wird von Gradle automatisch heruntergeladen)
node_plugin_version=7.1.0
node_version=22.14.0

# Minecraft 26.x platform versions.
fabric_loader_version_26=0.19.3
fabric_api_version_26=0.155.2+26.2

# Separate MaLiLib runtime dependency for Minecraft 26.2 (Modrinth version ID).
malilib_version_26_2=xKxhjDJ2
malilib_conditional_mixin_version=0.6.4

# ── Kotlin ────────────────────────────────────────────────────────────────────
# Kotlin JVM Plugin + fabric-language-kotlin Runtime-Mod
# Kotlin compiler plugin and FLK runtime use the same Kotlin release.
# FLK supplies Kotlin stdlib and the kotlinx libraries at runtime.
kotlin_version=2.4.20
# Minecraft 26.2 uses Java 25 and the matching Kotlin runtime.
fabric_language_kotlin_version_26=1.14.1+kotlin.2.4.20

# ── Drittanbieter-Bibliotheken (shade) ───────────────────────────────────────
caffeine_version=3.2.3
ktor_version=3.1.3
bouncycastle_version=1.85.2

# Minecraft 26.2 is configured in 26.x/build.gradle; no legacy mappings are required.
