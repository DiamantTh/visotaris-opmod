pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
    plugins {
        // Lädt Node.js + npm automatisch herunter – kein lokales npm nötig
        id 'com.github.node-gradle.node' version "${node_plugin_version}"
    }
}

rootProject.name = 'visotaris_opmod'

// Visotaris 1.2.x supports Minecraft 26.x only.
include '26.x'
